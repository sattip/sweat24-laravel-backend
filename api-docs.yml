        '404':
          description: Appointment request not found

    delete:
      tags:
        - Appointment Requests
      summary: Delete appointment request
      description: Delete an appointment request (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentRequest
          in: path
          required: true
          schema:
            type: integer
          description: Appointment request ID
      responses:
        '200':
          description: Appointment request deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Appointment request deleted successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Appointment request not found

