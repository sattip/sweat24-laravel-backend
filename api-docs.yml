              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrialAppointment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Trial Appointments
      summary: Create trial appointment
      description: Create a new trial appointment for a service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - appointment_date
                - appointment_time
              properties:
                service_id:
                  type: integer
                  description: Service ID for the trial
                  example: 1
                appointment_date:
                  type: string
                  format: date
                  description: Appointment date (must be today or future)
                  example: "2024-12-15"
                appointment_time:
                  type: string
                  description: Appointment time (HH:MM format)
                  example: "14:30"
                notes:
                  type: string
                  description: Additional notes for the appointment
                  example: "First time client - needs introduction"
      responses:
        '201':
          description: Trial appointment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TrialAppointment'
        '400':
          description: Validation error or business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Insufficient permissions

