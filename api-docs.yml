                  example: "john@example.com"
                date:
                  type: string
                  format: date
                  example: "2024-12-15"
                time:
                  type: string
                  example: "10:00"
                service_id:
                  type: integer
                  nullable: true
                  description: Service ID for this booking
                  example: 1
                instructor_id:
                  type: integer
                  nullable: true
                  description: Instructor ID for this booking
                  example: 123
                notes:
                  type: string
                  example: "VIP customer - special requirements"
