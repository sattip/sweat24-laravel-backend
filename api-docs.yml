                  example: 1
                client_name:
                  type: string
                  description: Client full name
                  example: "John Doe"
                client_phone:
                  type: string
                  description: Client phone number
                  example: "+306971234567"
                client_email:
                  type: string
                  format: email
                  nullable: true
                  description: Client email address
                  example: "john@example.com"
                preferred_time_slots:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                        example: "2024-12-15"
                      time:
                        type: string
                        example: "14:30"
                  description: Array of preferred date/time slots
                  example: [{"date": "2024-12-15", "time": "14:30"}, {"date": "2024-12-16", "time": "10:00"}]
                notes:
                  type: string
                  nullable: true
                  description: Additional notes
                  example: "First time client - needs introduction"
