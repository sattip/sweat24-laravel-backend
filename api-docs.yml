openapi: 3.0.3
info:
  title: Sweat93 Multi-Store Gym Management API
  description: |
    Complete API documentation for the Sweat93 Gym Management System featuring multi-store cash register, packages, appointments, and comprehensive admin functionality.

    ## Authentication
    All protected endpoints require Bearer token authentication:
    ```
    Authorization: Bearer {token}
    ```

    ## Multi-Store System
    The system supports multiple stores ("Βάρη", "Λαγονήσι") with:
    - Store-specific cash registers
    - Package usage tracking
    - Automated income posting per completed training
    - Per-store financial reports
  version: "1.0.0"
  contact:
    name: API Support
    email: support@sweat93.gr

servers:
  - url: https://api.sweat93.gr
    description: Production server
  - url: http://localhost:8000
    description: Development server

security:
  - bearerAuth: []

paths:
  # ============ AUTHENTICATION ============
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@sweat93.gr
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: "1|abc123def456"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully"

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get authenticated user information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ============ REGISTRATION ============
  /api/v1/registration/initial:
    post:
      tags:
        - Registration
      summary: Initial registration
      description: Start the two-phase registration process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phone
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                phone:
                  type: string
                  example: "+306971234567"
      responses:
        '200':
          description: Registration initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  registration_token:
                    type: string
                    example: "reg_abc123"

  /api/v1/registration/accept-terms:
    post:
      tags:
        - Registration
      summary: Accept terms and conditions
      description: Second phase of registration - accept terms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_token
                - accepted_terms
              properties:
                registration_token:
                  type: string
                  example: "reg_abc123"
                accepted_terms:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Terms accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/registration/complete:
    post:
      tags:
        - Registration
      summary: Complete registration
      description: Final phase of registration - set password and complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_token
                - password
                - password_confirmation
              properties:
                registration_token:
                  type: string
                  example: "reg_abc123"
                password:
                  type: string
                  format: password
                  example: "secure123"
                password_confirmation:
                  type: string
                  format: password
                  example: "secure123"
      responses:
        '200':
          description: Registration completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: "1|abc123def456"

  # ============ CASH REGISTER MANAGEMENT ============
  /api/v1/cash-register:
    get:
      tags:
        - Cash Register
      summary: List cash register entries
      description: Get paginated list of cash register entries (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          schema:
            type: integer
          description: Filter entries by store ID (optional - shows all stores if not provided)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          description: Items per page
        - name: type
          in: query
          schema:
            type: string
            enum: [income, withdrawal]
          description: Filter by entry type
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          description: Filter entries from this date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          description: Filter entries until this date
      responses:
        '200':
          description: Cash register entries retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashRegisterEntry'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Cash Register
      summary: Create cash register entry
      description: Create a new cash register entry (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - store_id
                - type
                - amount
                - description
                - category
              properties:
                store_id:
                  type: integer
                  description: Store ID where the entry belongs
                  example: 1
                type:
                  type: string
                  enum: [income, withdrawal]
                  example: "income"
                amount:
                  type: number
                  format: decimal
                  example: 50.00
                description:
                  type: string
                  example: "Manual cash entry"
                category:
                  type: string
                  example: "manual_entry"
                user_id:
                  type: integer
                  description: User ID for the entry
                  example: 1
                payment_method:
                  type: string
                  enum: [cash, card, transfer]
                  example: "cash"
      responses:
        '201':
          description: Cash register entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CashRegisterEntry'

  /api/v1/cash-register/limited:
    get:
      tags:
        - Cash Register
      summary: Limited cash register access
      description: Get recent cash register entries with limited access (Trainer/Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Limited cash register entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashRegisterEntry'

  /api/v1/cash-register/{cash_register}:
    get:
      tags:
        - Cash Register
      summary: Get cash register entry
      description: Get detailed information about a specific cash register entry (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: cash_register
          in: path
          required: true
          schema:
            type: integer
          description: Cash register entry ID
      responses:
        '200':
          description: Cash register entry details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CashRegisterEntry'

    put:
      tags:
        - Cash Register
      summary: Update cash register entry
      description: Update cash register entry information (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: cash_register
          in: path
          required: true
          schema:
            type: integer
          description: Cash register entry ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [income, withdrawal]
                  example: "income"
                amount:
                  type: number
                  format: decimal
                  example: 75.00
                description:
                  type: string
                  example: "Updated entry description"
                category:
                  type: string
                  example: "service"
      responses:
        '200':
          description: Cash register entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CashRegisterEntry'

    delete:
      tags:
        - Cash Register
      summary: Delete cash register entry
      description: Delete a cash register entry (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: cash_register
          in: path
          required: true
          schema:
            type: integer
          description: Cash register entry ID
      responses:
        '200':
          description: Cash register entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cash register entry deleted successfully"

  /api/v1/cash-register/summary:
    get:
      tags:
        - Cash Register
      summary: Get cash register summary by store
      description: Get summary of cash register entries grouped by store (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cash register summary by store
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      type: object
                      properties:
                        store_id:
                          type: integer
                          example: 1
                        store_name:
                          type: string
                          example: "Βάρη"
                        store_color:
                          type: string
                          example: "#10B981"
                        total_entries:
                          type: integer
                          example: 8
                        total_income:
                          type: number
                          format: decimal
                          example: 1000.00
                        total_expenses:
                          type: number
                          format: decimal
                          example: 0.00
                  unknown:
                    type: object
                    properties:
                      total_entries:
                        type: integer
                        example: 0
                      total_income:
                        type: number
                        format: decimal
                        example: 0.00
                      total_expenses:
                        type: number
                        format: decimal
                        example: 0.00
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

  # ============ EXPENSE CATEGORIES ============
  /api/v1/expense-categories:
    get:
      tags:
        - Expense Categories
      summary: List expense categories
      description: Get paginated list of expense categories (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [main, subcategory]
          description: Filter by category type
        - name: active
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: parent_id
          in: query
          schema:
            type: integer
          description: Filter subcategories by parent ID
        - name: search
          in: query
          schema:
            type: string
          description: Search by category name
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of expense categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseCategory'
                  links:
                    type: object
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
    post:
      tags:
        - Expense Categories
      summary: Create expense category
      description: Create a new expense category (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category_type
              properties:
                name:
                  type: string
                  example: "New Category"
                description:
                  type: string
                  example: "Category description"
                category_type:
                  type: string
                  enum: [main, subcategory]
                  example: "main"
                parent_id:
                  type: integer
                  example: 1
                is_active:
                  type: boolean
                  example: true
                sort_order:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategory'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '422':
          description: Validation failed

  /api/v1/expense-categories/tree:
    get:
      tags:
        - Expense Categories
      summary: Get expense categories tree
      description: Get hierarchical structure of expense categories (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hierarchical expense categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        category_type:
                          type: string
                        is_active:
                          type: boolean
                        sort_order:
                          type: integer
                        subcategories:
                          type: array
                          items:
                            type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

  /api/v1/expense-categories/options:
    get:
      tags:
        - Expense Categories
      summary: Get expense categories options
      description: Get categories formatted for dropdown/select options (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [main, subcategory]
          description: Filter by category type
      responses:
        '200':
          description: Categories formatted for dropdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: integer
                        label:
                          type: string
                        type:
                          type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

  /api/v1/expense-categories/{expenseCategory}:
    get:
      tags:
        - Expense Categories
      summary: Get expense category
      description: Get detailed information about a specific expense category (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: expenseCategory
          in: path
          required: true
          schema:
            type: integer
          description: Expense category ID
      responses:
        '200':
          description: Expense category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategory'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found
    put:
      tags:
        - Expense Categories
      summary: Update expense category
      description: Update expense category information (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: expenseCategory
          in: path
          required: true
          schema:
            type: integer
          description: Expense category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Category"
                description:
                  type: string
                  example: "Updated description"
                category_type:
                  type: string
                  enum: [main, subcategory]
                  example: "main"
                parent_id:
                  type: integer
                  example: 1
                is_active:
                  type: boolean
                  example: true
                sort_order:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategory'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found
        '422':
          description: Validation failed
    delete:
      tags:
        - Expense Categories
      summary: Delete expense category
      description: Delete an expense category (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: expenseCategory
          in: path
          required: true
          schema:
            type: integer
          description: Expense category ID
      responses:
        '200':
          description: Category deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found
        '422':
          description: Cannot delete category with dependencies

  /api/v1/expense-categories/{expenseCategory}/toggle-status:
    post:
      tags:
        - Expense Categories
      summary: Toggle category status
      description: Toggle active/inactive status of an expense category (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: expenseCategory
          in: path
          required: true
          schema:
            type: integer
          description: Expense category ID
      responses:
        '200':
          description: Category status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategory'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found

  # ============ BUSINESS EXPENSES ============
  /api/v1/business-expenses:
    get:
      tags:
        - Business Expenses
      summary: List business expenses
      description: Get paginated list of business expenses (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          schema:
            type: integer
          description: Filter expenses by store ID (optional - shows all stores if not provided)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          description: Items per page
        - name: category
          in: query
          schema:
            type: string
          description: Filter by expense category
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          description: Filter expenses from this date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          description: Filter expenses until this date
      responses:
        '200':
          description: Business expenses retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessExpense'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Business Expenses
      summary: Create business expense
      description: Create a new business expense entry (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - store_id
                - amount
                - category
                - description
              properties:
                store_id:
                  type: integer
                  description: Store ID where expense occurred
                  example: 1
                amount:
                  type: number
                  format: decimal
                  example: 150.00
                category:
                  type: string
                  example: "Rent"
                description:
                  type: string
                  example: "Monthly office rent payment"
                date:
                  type: string
                  format: date
                  example: "2024-12-01"
                payment_method:
                  type: string
                  enum: [cash, card, transfer]
                  example: "transfer"
      responses:
        '201':
          description: Business expense created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BusinessExpense'

  /api/v1/business-expenses/{business_expense}:
    get:
      tags:
        - Business Expenses
      summary: Get business expense
      description: Get detailed information about a specific business expense (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: business_expense
          in: path
          required: true
          schema:
            type: integer
          description: Business expense ID
      responses:
        '200':
          description: Business expense details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BusinessExpense'

    put:
      tags:
        - Business Expenses
      summary: Update business expense
      description: Update business expense information (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: business_expense
          in: path
          required: true
          schema:
            type: integer
          description: Business expense ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: decimal
                  example: 175.00
                category:
                  type: string
                  example: "Utilities"
                description:
                  type: string
                  example: "Updated expense description"
                date:
                  type: string
                  format: date
                  example: "2024-12-15"
      responses:
        '200':
          description: Business expense updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BusinessExpense'

    delete:
      tags:
        - Business Expenses
      summary: Delete business expense
      description: Delete a business expense entry (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: business_expense
          in: path
          required: true
          schema:
            type: integer
          description: Business expense ID
      responses:
        '200':
          description: Business expense deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Business expense deleted successfully"

  # ============ STORE MANAGEMENT ============

  /api/v1/admin/stores:
    get:
      tags:
        - Store Management
      summary: List stores
      description: Get paginated list of stores (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          description: Items per page
        - name: active
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: search
          in: query
          schema:
            type: string
          description: Search by store name
      responses:
        '200':
          description: Stores retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
                  total:
                    type: integer
                    example: 2

    post:
      tags:
        - Store Management
      summary: Create store
      description: Create a new store (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Γλυφάδα"
                address:
                  type: string
                  example: "Λεωφόρος Γλυφάδας 150"
                is_active:
                  type: boolean
                  example: true
                color:
                  type: string
                  description: Hex color code for the store
