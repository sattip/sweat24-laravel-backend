  # ============ MULTI-STORE CASH REGISTER ============
  /api/v1/bookings/{booking}/complete:
    post:
      tags:
        - Multi-Store System
      summary: Complete booking and record income
      description: |
        Complete a booking, deduct package sessions, and automatically record income to the store's cash register.

        **Business Logic:**
        - Validates store assignment
        - Decrements remaining package sessions
        - Calculates per-training cost: `package_price / total_sessions`
        - Handles rounding for last session to match package total
        - Creates cash register entry with income type
      security:
        - bearerAuth: []
      parameters:
        - name: booking
          in: path
          required: true
          schema:
            type: integer
          description: Booking ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - completed_by
              properties:
                completed_by:
                  type: integer
                  description: User ID who completed the booking
                  example: 1
      responses:
        '200':
          description: Booking completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Booking completed successfully"
                  data:
                    type: object
                    properties:
                      booking:
                        $ref: '#/components/schemas/Booking'
                      user_package:
                        $ref: '#/components/schemas/UserPackage'
                      cash_entry:
                        $ref: '#/components/schemas/CashRegisterEntry'
        '400':
          description: Validation error or business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

