                    example: false
                  message:
                    type: string
                    example: "Δεν έχετε ενεργό πακέτο με διαθέσιμες συνεδρίες για EMS TRAINING (ανιχνεύθηκε αυτόματα)."
                  error_code:
                    type: string
                    enum: ["INSUFFICIENT_SESSIONS_FOR_SERVICE", "NO_SESSIONS_REMAINING", "INSUFFICIENT_SESSIONS", "DUPLICATE_PACKAGE"]
                    example: "INSUFFICIENT_SESSIONS_FOR_SERVICE"
