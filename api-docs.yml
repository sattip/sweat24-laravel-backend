  # ============ PACKAGE FREEZE/UNFREEZE ============
  /api/user-packages/{userPackage}/freeze:
    post:
      tags:
        - User Packages
        - Package Management
      summary: Freeze (pause) a user package
      description: |
        Freeze a package to pause its expiration. When unfrozen, the frozen days will be added to the expiry date.
        This is useful when the gym is closed or a member is on vacation.
      security:
        - bearerAuth: []
      parameters:
        - name: userPackage
          in: path
          required: true
          schema:
            type: integer
          description: User Package ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  example: 10
                  description: Maximum days the package can be frozen (optional)
      responses:
        '200':
          description: Package frozen successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Package frozen successfully"
                  user_package:
                    $ref: '#/components/schemas/UserPackage'

  /api/user-packages/{userPackage}/unfreeze:
    post:
      tags:
        - User Packages
        - Package Management
      summary: Unfreeze (resume) a user package
      description: |
        Unfreeze a package and automatically extend its expiry date by the number of frozen days.
        The system calculates how many days the package was frozen and adds them to the expiry date.
      security:
        - bearerAuth: []
      parameters:
        - name: userPackage
          in: path
          required: true
          schema:
            type: integer
          description: User Package ID
      responses:
        '200':
          description: Package unfrozen successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Package unfrozen successfully"
                  user_package:
                    $ref: '#/components/schemas/UserPackage'

